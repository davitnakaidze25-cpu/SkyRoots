<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SkyRoots — Deep space aeroponic plant monitoring and chamber control via Bluetooth Low Energy.">
    <meta name="theme-color" content="#040608">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SkyRoots | Smart Monitoring</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ─── Background Layers ─────────────────────────────────────── -->
    <div id="spaceBgContainer" class="theme-bg">
        <canvas id="starfield"></canvas>
        <div class="nebula-layer nebula-1"></div>
        <div class="nebula-layer nebula-2"></div>
        <div class="nebula-layer nebula-3"></div>
    </div>
    <div id="oceanBg" class="theme-bg"></div>
    <div id="verdantBg" class="theme-bg"></div>
    <div class="aether-overlay" id="aetherOverlay"></div>

    <!-- ─── SVG Defs (shared gradients for sparklines) ────────────── -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="sparkGradientGreen" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#00ff88" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="sparkGradientAmber" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="sparkGradientDanger" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ff4b4b" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#ff4b4b" stop-opacity="0"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- ─── App Shell ─────────────────────────────────────────────── -->
    <div class="app-container">

        <header>
            <h1 class="brand-logo">SkyRoots<span>.io</span></h1>
            <div id="connectionDot" class="status-dot"></div>
        </header>

        <!-- Screens (content injected by ES module components) -->
        <div id="screen-dashboard" class="screen active"></div>
        <div id="screen-profiles" class="screen"></div>
        <div id="screen-settings" class="screen"></div>
        <div id="screen-intelligence" class="screen"></div>

    </div>

    <!-- ─── Bottom Navigation ─────────────────────────────────────── -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <div class="nav-item active" id="nav-dashboard">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="9" rx="1"/>
                        <rect x="14" y="3" width="7" height="5" rx="1"/>
                        <rect x="14" y="12" width="7" height="9" rx="1"/>
                        <rect x="3" y="16" width="7" height="5" rx="1"/>
                    </svg>
                </div>
                <span class="nav-label">Dashboard</span>
            </div>
            <div class="nav-item" id="nav-profiles">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 20h10"/>
                        <path d="M10 20c5.5-2.5 0.8-6.4 3-10"/>
                        <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/>
                        <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>
                    </svg>
                </div>
                <span class="nav-label">Profiles</span>
            </div>
            <div class="nav-item" id="nav-intelligence">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5z"/>
                        <path d="M19 2l.5 2 2 .5-2 .5-.5 2-.5-2-2-.5 2-.5z" opacity=".6"/>
                        <path d="M5 18l.5 2 2 .5-2 .5-.5 2-.5-2-2-.5 2-.5z" opacity=".6"/>
                    </svg>
                </div>
                <span class="nav-label">Grooty</span>
            </div>
            <div class="nav-item" id="nav-settings">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </div>
                <span class="nav-label">Settings</span>
            </div>
        </div>
    </nav>

    <!-- ─── Background Modules ────────────────────────────────────── -->
    <script type="module" src="components/starfield.js"></script>
    <script type="module">
        import { initOcean } from './components/ocean.js';
        import { initVerdant } from './components/verdant.js';
        initOcean('oceanBg');
        initVerdant('verdantBg');
    </script>

    <!-- ─── App Module Entry Point ────────────────────────────────── -->
    <script type="module" src="app.js"></script>

</body>
</html>
