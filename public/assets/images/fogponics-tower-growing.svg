<svg xmlns="http://www.w3.org/2000/svg" id="drift" viewBox="0 0 410 615" width="1024" height="1536">
  <title>Plants and mist in the SkyRoots growing chamber</title>
  <defs>
    <!-- The side channels follow the arch and the rims of the three blue tiers. -->
    <path id="channel" d="M205 76C135 76 84 166 86 268c1 104 52 202 118 204-23-4-39-18-51-35l-1-12q4-4 15-4v-43q-32-2-41-13 11-13 41-44v-28q-31-2-42-16 11-12 42-48v-32q-30-2-42-16 12-13 42-47V87q20-10 38-11Z"/>
    <clipPath id="chamber">
      <use href="#channel"/>
      <use href="#channel" transform="translate(410) scale(-1 1)"/>
    </clipPath>
    <linearGradient id="outer" x1="0" y1="1" x2=".8" y2=".05" gradientUnits="objectBoundingBox">
      <stop stop-color="#315e37"/><stop offset=".42" stop-color="#54883c"/><stop offset=".83" stop-color="#8cb856"/><stop offset="1" stop-color="#b8d96e"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1=".9" x2="1" y2=".1">
      <stop stop-color="#46753a"/><stop offset=".53" stop-color="#83b54c"/><stop offset="1" stop-color="#c3dc74"/>
    </linearGradient>
    <linearGradient id="leaf-fold" x1="0" y1=".7" x2="1" y2=".2">
      <stop stop-color="#315f33" stop-opacity=".8"/><stop offset="1" stop-color="#74a244" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="cloud">
      <stop stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".46" stop-color="#ebfffe" stop-opacity=".53"/>
      <stop offset="1" stop-color="#c2f5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="vapor" x="-30%" y="-140%" width="160%" height="380%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <path id="leaf" d="M0 0q-3-4-8-5-5-1-5-5-5 0-5-5-5-1-5-6-4-1-3-5-3-2-2-7 1-5 6-5 3-3 7-1 4-1 6 3 5-1 6 4 4 0 4 6 4 2 2 6 2 4 0 8Q2-7 0 0Z"/>
    <g id="blade">
      <use href="#leaf"/>
      <path d="M0 0Q-6-20-23-36q9 5 15 13L2-23Q5-13 0 0Z" fill="url(#leaf-fold)"/>
      <g fill="none" stroke="#dce990" stroke-linecap="round">
        <path d="M0 0Q-5-17-23-36" stroke-width="1.2" opacity=".84"/>
        <path d="M-4-11l-9-5m4-4-10-5m8 2 1-9" stroke-width=".7" opacity=".58"/>
      </g>
    </g>
    <g id="rosette">
      <use href="#blade" fill="url(#outer)" transform="rotate(31) scale(.86 .89)"/>
      <use href="#blade" fill="url(#outer)" transform="rotate(-45) scale(.84 .94)"/>
      <use href="#blade" fill="url(#inner)" transform="rotate(-11) scale(.76 .85)"/>
      <use href="#blade" fill="url(#inner)" transform="rotate(38) scale(.48 .54)"/>
    </g>
    <g id="seedling">
      <use href="#blade" fill="url(#outer)" transform="rotate(-33) scale(.76 .99)"/>
      <use href="#blade" fill="url(#inner)" transform="rotate(19) scale(.81 .95)"/>
      <use href="#blade" fill="url(#inner)" transform="rotate(-54) scale(.46 .62)"/>
    </g>
    <g id="plume" fill="url(#cloud)">
      <ellipse cx="-6" cy="2" rx="39" ry="12" transform="rotate(-13)"/>
      <ellipse cx="2" cy="-3" rx="25" ry="12" transform="rotate(9)"/>
      <ellipse cx="19" cy="-3" rx="21" ry="8"/>
      <path d="M-42 8C-18 12-11-13 9-5S27-5 40-10" fill="none" stroke="#f2ffff" stroke-width="4" opacity=".72" filter="url(#vapor)"/>
    </g>
  </defs>
  <style>
    #drift:target .vapor-left { animation: drift-left 6s ease-in-out infinite alternate; }
    #drift:target .vapor-right { animation: drift-right 7.5s ease-in-out -3s infinite alternate; }
    @keyframes drift-left { from { transform: translate(-3px, 5px); opacity: .75; } to { transform: translate(4px, -7px); opacity: 1; } }
    @keyframes drift-right { from { transform: translate(4px, 3px); opacity: .8; } to { transform: translate(-4px, -6px); opacity: 1; } }
  </style>
  <g clip-path="url(#chamber)">
    <g class="vapor-left">
      <use href="#plume" transform="translate(126 211) rotate(-13) scale(.83)"/>
      <use href="#plume" transform="translate(123 305) rotate(9)"/>
      <use href="#plume" transform="translate(141 400) rotate(-9) scale(.88)"/>
    </g>
    <g class="vapor-right">
      <use href="#plume" transform="translate(279 200) rotate(12) scale(-.82 .82)"/>
      <use href="#plume" transform="translate(289 301) rotate(-12) scale(-1 1)"/>
      <use href="#plume" transform="translate(268 395) rotate(11) scale(-.86 .86)"/>
    </g>
  </g>
  <!-- The plant origins sit just inside each net-cup rim in the existing tower render. -->
  <use href="#seedling" transform="translate(149 151) rotate(-6) scale(.94)"/>
  <use href="#rosette" transform="translate(259 151) scale(-.81 .86)"/>
  <use href="#rosette" transform="translate(148 244) rotate(-2) scale(1.05)"/>
  <use href="#seedling" transform="translate(259 245) scale(-1.13 1.05)"/>
  <use href="#seedling" transform="translate(149 337) rotate(-10) scale(.99)"/>
  <use href="#rosette" transform="translate(259 338) scale(-1.01 .98)"/>
</svg>
