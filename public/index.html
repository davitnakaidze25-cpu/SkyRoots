<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SkyRoots — Fogponics plant monitoring and growing chamber control via Bluetooth Low Energy.">
    <meta name="theme-color" content="#d9e4d2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SkyRoots | Smart Monitoring</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/skyroots-favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/skyroots-touch-icon.png">
    <link rel="manifest" href="app.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="fog-background" aria-hidden="true"></div>
    <!-- ─── SVG Defs (shared gradients for sparklines) ────────────── -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="sparkGradientGreen" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#54835a" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#54835a" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="sparkGradientAmber" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#a97932" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#a97932" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="sparkGradientDanger" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ff4b4b" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="#ff4b4b" stop-opacity="0"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- ─── App Shell ─────────────────────────────────────────────── -->
    <div class="app-container">

        <header>
            <a class="brand-logo" href="#dashboard" aria-label="SkyRoots home"><img class="brand-mark" src="assets/images/skyroots-logo-192.png" width="38" height="38" alt=""><span>skyroots<span class="brand-period">.</span></span></a>
            <a class="header-status" id="nav-settings" href="#settings" aria-controls="screen-settings" aria-label="Open device connection"><span id="connectionDot" class="status-dot" aria-hidden="true"></span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg></a>
        </header>

        <!-- Screens (content injected by ES module components) -->
        <div id="screen-dashboard" class="screen active"></div>
        <div id="screen-profiles" class="screen"></div>
        <div id="screen-settings" class="screen"></div>
        <div id="screen-intelligence" class="screen"></div>
        <div id="screen-camera" class="screen"></div>

    </div>

    <!-- ─── Bottom Navigation ─────────────────────────────────────── -->
    <nav class="bottom-nav" aria-label="Main navigation">
        <div class="bottom-nav-inner">
            <button type="button" class="nav-item active" id="nav-dashboard" aria-controls="screen-dashboard" aria-current="page">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="9" rx="1"/>
                        <rect x="14" y="3" width="7" height="5" rx="1"/>
                        <rect x="14" y="12" width="7" height="9" rx="1"/>
                        <rect x="3" y="16" width="7" height="5" rx="1"/>
                    </svg>
                </div>
                <span class="nav-label">Home</span>
            </button>
            <button type="button" class="nav-item" id="nav-profiles" aria-controls="screen-profiles">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 20h10"/>
                        <path d="M10 20c5.5-2.5 0.8-6.4 3-10"/>
                        <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/>
                        <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>
                    </svg>
                </div>
                <span class="nav-label">Crops</span>
            </button>
            <button type="button" class="nav-item" id="nav-camera" aria-controls="screen-camera">
                <div class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 9.5 3h5L16 5h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><circle cx="12" cy="12" r="4"/></svg></div>
                <span class="nav-label">Camera</span>
            </button>
            <button type="button" class="nav-item" id="nav-intelligence" aria-controls="screen-intelligence">
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5z"/>
                        <path d="M19 2l.5 2 2 .5-2 .5-.5 2-.5-2-2-.5 2-.5z" opacity=".6"/>
                        <path d="M5 18l.5 2 2 .5-2 .5-.5 2-.5-2-2-.5 2-.5z" opacity=".6"/>
                    </svg>
                </div>
                <span class="nav-label">Grooty</span>
            </button>
        </div>
    </nav>

    <!-- ─── App Module Entry Point ────────────────────────────────── -->
    <script type="module" src="app.js"></script>

</body>
</html>
